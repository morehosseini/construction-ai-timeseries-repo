name: construction-timeseries
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pandas>=1.5.0
  - numpy>=1.23.0
  - scipy>=1.10.0
  - statsmodels>=0.14.0
  - matplotlib>=3.6.0
  - seaborn>=0.12.0
  - jupyter>=1.0.0
  - ipykernel>=6.20.0
  - openpyxl>=3.0.0  # For Excel file handling
  - xlrd>=2.0.0      # For older Excel formats
  - pip
  - pip:
    - black>=23.0.0  # Code formatting
    - flake8>=6.0.0  # Linting
